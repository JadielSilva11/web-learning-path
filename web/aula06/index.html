<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS - input e function</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <section class="calc">
        <input class="view" id="n1" type="text" placeholder="Número 1">
        <input class="view" id="n2" type="text" placeholder="Número 2">
        
        <div class="calc-line">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn op">=</button>
        </div>
        <div class="calc-line">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn op">+</button>
        </div>
        <div class="calc-line">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn op">_</button>
        </div>
        <div class="calc-line">
            <button id="zero" class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn op">/</button>
            <button class="btn op">x</button>
        </div>
    </section>
</body>
</html>
